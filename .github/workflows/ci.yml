name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  # No app is launched here; skipping the Electron download keeps the job fast.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    # Pinned: the runner image migrates on its own schedule, and an Electron build
    # should not go red for a reason that has nothing to do with this change.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The whole suite, not `--changed`: a fresh clone has no base to diff against.
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Story tests
        run: pnpm test:stories
      - name: Build
        run: pnpm build
      - name: Documentation gates
        run: pnpm docs:check && pnpm docs:symbols
      - name: Shape
        run: pnpm shape
      - name: No secrets
        run: pnpm security:secrets

  audit:
    # Advisories arrive on the registry's schedule, not ours; report them without
    # blocking a change that did nothing wrong.
    # Pinned: the runner image migrates on its own schedule, and an Electron build
    # should not go red for a reason that has nothing to do with this change.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
