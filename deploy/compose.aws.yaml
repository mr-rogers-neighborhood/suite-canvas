# The deployed host's override: CloudWatch Logs for the services that have something to say.
#
#   docker compose -f compose.yaml -f deploy/compose.aws.yaml up -d
#
# This replaces the default `json-file` driver with `awslogs`, so stdout and stderr land in
# CloudWatch without an agent, a sidecar or a file to rotate. On a workstation the driver
# needs AWS credentials it does not have, which is why this is an override and not the base
# file.
#
# The instance role supplies the permission. The log group is created once by
# `deploy/cloudwatch/logs.sh` rather than by `awslogs-create-group`, because a container
# that can create log groups can create them anywhere.
#
# The buffer is bounded (`awslogs-max-buffered-events`), so a log write that cannot keep up
# is dropped rather than held forever: a stalled driver must not stall a document write.
#
# There is no `awslogs-mode` option. It reads like it belongs next to the other `awslogs-*`
# keys, and Docker rejects it outright with `unknown log opt 'awslogs-mode'`, which fails
# the container at *create* time. The non-blocking behaviour is the bounded buffer above.
#
# One group, one stream per service, so `aws logs tail` follows a process and a query across
# the group follows all three.

services:
  app:
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: ${SUITE_LOG_GROUP:-suite-app}
        awslogs-stream: app
        awslogs-max-buffered-events: "8192"

  control-plane:
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: ${SUITE_LOG_GROUP:-suite-app}
        awslogs-stream: control-plane
        awslogs-max-buffered-events: "8192"
    # RDS signs its endpoint certificate with the Amazon RDS CA, which no Node image
    # trusts. `pg` now reads `sslmode=require` as `verify-full`, so the honest choice is to
    # trust that CA rather than to weaken the mode: the bundle is mounted and Node adds it
    # to its trust store. `deploy/rds-ca.sh` fetches it.
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/rds-global-bundle.pem
    volumes:
      - ${SUITE_RDS_CA_PATH:-/etc/suite/rds-global-bundle.pem}:/etc/ssl/rds-global-bundle.pem:ro

  caddy:
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: ${SUITE_LOG_GROUP:-suite-app}
        awslogs-stream: caddy
        awslogs-max-buffered-events: "8192"
