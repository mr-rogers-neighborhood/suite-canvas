# The Canvas desktop build.
#
# `deb` is the primary Linux target: it is what carries the `.canvas` MIME
# association and the `x-scheme-handler/suite-canvas` declaration, because those
# live in the desktop entry the package installs. `AppImage` is the portable
# alternative and registers its protocols at runtime, so it works without an
# installer and without root.
#
# macOS and Windows are configured but cannot be produced here: both need a
# signing identity this repository does not have, and an unsigned build is not
# something to hand a user.
# The name travels into the feed's `url`, so it stays a name a URL can carry: no
# spaces, no capitals to disagree about, and the same stem as the executable.
artifactName: suite-canvas-${version}-${arch}.${ext}

appId: run.suite.canvas
productName: Suite Canvas
copyright: Copyright © Suite

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../canvas/dist
    to: renderer
  # The window's own icon: a desktop entry reads the theme, but `_NET_WM_ICON` — what a
  # panel draws in the taskbar — comes from `BrowserWindow({ icon })` and nothing else.
  - from: build/icon.png
    to: icon.png
# Start discovers an app by the manifest beside its executable, so this lands
# next to the binary rather than in resources.
extraFiles:
  - from: suite.app.json
    to: suite.app.json

asar: true

# The window's own icon travels beside the asar: a desktop entry reads the hicolor theme,
# but a running window's taskbar icon is `_NET_WM_ICON`, which Chromium fills only when
# `BrowserWindow` is handed an image.


# Fuses are the switches an attacker cannot turn back on after packaging:
# without them, a modified binary can be told to run any Node script.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Every page is served from a custom protocol now, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false

linux:
  syncDesktopName: true
  target:
    - deb
    - AppImage
  # Without this the binary is named after the package, which for a scoped name
  # becomes `@suitedesktop`. The executable name is part of what Start records,
  # so it has to be a name a person would recognise.
  executableName: suite-canvas
  category: Office
  icon: build/icons
  synopsis: A local-first canvas for connected thinking
  description: Cards, boards and writing in one document that works offline and lives in a file you own.
  desktop:
    entry:
      MimeType: application/x-suite-canvas;
      StartupWMClass: Suite Canvas

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# No `appImage.license`: electron-builder reads it as a path to a file to show at
# install, wants `.txt` or `.html`, and a bare `MIT` made it look for a file with
# that name and fail the build. The licence is in the repository, and in the app's
# own About rows.

mac:
  category: public.app-category.productivity
  target:
    - dmg

win:
  target:
    - nsis

fileAssociations:
  - ext: canvas
    name: Suite Canvas Workspace
    description: A Suite Canvas workspace
    role: Editor
    mimeType: application/x-suite-canvas

# No per-app scheme: Start owns `suite://` and routes to the app. A second
# scheme nothing registers or handles is a promise the app does not keep.

# The feed the app's updater reads, and the one the hub reads when a person asks.
# `latest/download` is a stable redirect to the newest release's assets, so the
# URL never has to be rewritten per version, and GitHub serves the manifest the
# updater writes beside the artifacts.
publish:
  provider: generic
  url: https://github.com/mr-rogers-neighborhood/suite-canvas/releases/latest/download
