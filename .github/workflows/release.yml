# Tag-driven release: one version, one image, one GitHub release.
#
# Deliberately small. No signing, no SBOM attestation, no multi-arch build, no
# self-hosted runner: those are V1 work and are named as such in
# docs/how-to/release.md. The runtime image is the collab server; Caddy keeps building
# from the same Dockerfile.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege at the top; the two jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Version and docs agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $declared"
            exit 1
          fi

      - name: Docs are current
        run: |
          node scripts/docs-check.mjs
          node scripts/generate-limits.mjs --check

  image:
    name: Runtime image to GHCR
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/suite"
          short="${GITHUB_SHA::12}"
          echo "ref=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            echo "${image}:sha-${short}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          # Baked into the image, so /metrics, /api/admin/status and the startup
          # line name the release that is running.
          build-args: |
            SUITE_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          {
            awk -v heading="## [${version}]" '
              index($0, heading) == 1 { inside = 1 }
              inside && /^## / && index($0, heading) != 1 { exit }
              inside { print }
            ' CHANGELOG.md
          } > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no \`## [${version}]\` section"
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "**Image:** \`${{ needs.image.outputs.ref }}@${{ needs.image.outputs.digest }}\`"
            echo ""
            echo "**Rollback:** re-pin the previous digest — see [docs/how-to/release.md](docs/how-to/release.md#rollback)."
            echo "Gate evidence: [docs/roadmap/alpha.md](docs/roadmap/alpha.md#7-alpha-exit-gates)."
          } >> "$notes"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
