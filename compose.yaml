# One deployment for a hosted instance and for self-hosting. `app` owns all six
# SQLite files in the `suite-data` volume; `caddy` terminates TLS, serves the
# built canvas and proxies the API and WebSocket to `app`.
#
# Run with: cp .env.example .env && docker compose up -d --build
# A real deployment (instance sizing, EBS, Cloudflare, backups) is
# documented in docs/how-to/deploy.md. Every setting the server validates is in
# .env.example; empty means "use the built-in default".
#
# Single replica by design: rooms, presence, projection state and rate-limit
# counters live in the `app` process and SQLite is a local file. Never run two
# `app` containers against one volume (or two volumes behind one hostname).
name: suite

services:
  app:
    # Built on this host, never pulled. `deploy/deploy.sh` tags every build
    # `suite:<version>` and `suite:local`, and writes the version tag into
    # `SUITE_IMAGE` in `.env`; a rollback points `SUITE_IMAGE` at a
    # `suite:rollback-<version>` tag taken before the build. The default is a
    # local name so an unset `.env` cannot send compose to a registry.
    image: ${SUITE_IMAGE:-suite:local}
    build:
      context: .
      target: runtime
      # The version the image reports through `/metrics` and
      # `/api/admin/status`. A workflow used to bake it at push time; a build
      # from a checkout has to pass it, or the image says 0.0.0.
      args:
        SUITE_VERSION: ${SUITE_VERSION:-0.0.0}
    restart: unless-stopped
    # Hardening. The image already ends with `USER node`; naming the uid here
    # keeps that visible in the file that deploys it. The root filesystem is
    # read-only and the six stores are the only writable thing, so a compromised
    # process cannot rewrite its own code, drop a cron entry or leave a payload
    # behind. `no-new-privileges` plus an empty capability set means no setuid
    # escalation is available even if one is found. `/tmp` is a memory-backed
    # scratch dir: Node and tsx want one and nothing here belongs on disk.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    # Sized for a 1 vCPU / 2 GB instance (see docs/how-to/deploy.md). Every open
    # room stays in memory while a client is connected, so a hard cap turns a
    # leak or one huge board into a container restart instead of an OOM kill of
    # the whole box. Raise both before raising the file-descriptor limit; the
    # room count is what actually drives memory here.
    mem_limit: 1536m
    cpus: "1.0"
    environment:
      NODE_ENV: production
      PORT: "1234"
      HEALTH_PORT: "1235"
      # Six stores exist in code and all six are configured here, on the
      # `suite-data` volume. Attachments used to default to the process working
      # directory and settings/licences to `:memory:`, so a container recreate
      # lost images, quota overrides and licence claims. Do not point any of
      # these at a path outside /data: the volume is what a backup and a restore
      # swap out. `SUITE_REQUIRE_DURABLE_STORES=1` below turns a `:memory:` or
      # CWD-relative store into a boot error instead of a disposable one.
      SUITE_DB: ${SUITE_DB:-/data/documents.sqlite}
      SUITE_SHARES_DB: ${SUITE_SHARES_DB:-/data/shares.sqlite}
      SUITE_WORKSPACES_DB: ${SUITE_WORKSPACES_DB:-/data/workspaces.sqlite}
      SUITE_SETTINGS_DB: ${SUITE_SETTINGS_DB:-/data/settings.sqlite}
      SUITE_LICENCE_DB: ${SUITE_LICENCE_DB:-/data/licences.sqlite}
      SUITE_ATTACHMENTS_DB: ${SUITE_ATTACHMENTS_DB:-/data/attachments.sqlite}
      SUITE_REQUIRE_DURABLE_STORES: "1"
      # Credentials and switches. Empty tokens are the documented defaults:
      # worker tokens generated per start, self-host mode, no operators.
      SUITE_PROJECTION_TOKEN: ${SUITE_PROJECTION_TOKEN:-}
      SUITE_SOURCE_TOKEN: ${SUITE_SOURCE_TOKEN:-}
      # The operator surface is a session, not a secret: an account whose address is
      # on this list may read and mutate `/api/admin/*` and read `/metrics`.
      SUITE_ADMIN_EMAILS: ${SUITE_ADMIN_EMAILS:-}
      # 1 lets a scrape from inside the container read /metrics with no credential.
      SUITE_METRICS_LOCAL: ${SUITE_METRICS_LOCAL:-}
      # The control plane's origin: the relay verifies a session JWT against the
      # key set published there (ADR-0074). Unset means no account can sync, and
      # anonymous and share-link use are unaffected.
      SUITE_AUTH_URL: ${SUITE_AUTH_URL:-}
      # Where this process fetches the key set. The public name is what the token's
      # `iss`/`aud` say; this is the address the container can actually reach, so a
      # relay does not have to resolve its own public hostname through the proxy.
      SUITE_AUTH_JWKS_URL: ${SUITE_AUTH_JWKS_URL:-http://control-plane:1236/api/auth/jwks}
      SUITE_ALLOWED_ORIGINS: ${SUITE_ALLOWED_ORIGINS:-}
      SUITE_PUBLIC_URL: ${SUITE_PUBLIC_URL:-}
      SUITE_HOSTED: ${SUITE_HOSTED:-0}
      SUITE_LICENCE_PUBLIC_KEY: ${SUITE_LICENCE_PUBLIC_KEY:-}
      SUITE_RELAY_PURGE_TOKEN: ${SUITE_RELAY_PURGE_TOKEN:-}
      SUITE_TRUST_PROXY: ${SUITE_TRUST_PROXY:-0}
      SUITE_LOG_LEVEL: ${SUITE_LOG_LEVEL:-info}
      # Quotas. Empty means the built-in default for the mode (unlimited for a
      # self-host, the hosted set when SUITE_HOSTED=1). Sizes are bytes;
      # "unlimited" is also accepted.
      SUITE_MAX_WORKSPACES: ${SUITE_MAX_WORKSPACES:-}
      SUITE_DOCUMENT_BYTES_PER_WORKSPACE: ${SUITE_DOCUMENT_BYTES_PER_WORKSPACE:-}
      SUITE_PROJECTION_BYTES_PER_WORKSPACE: ${SUITE_PROJECTION_BYTES_PER_WORKSPACE:-}
      SUITE_ATTACHMENT_BYTES_PER_WORKSPACE: ${SUITE_ATTACHMENT_BYTES_PER_WORKSPACE:-}
      SUITE_MAX_SHARES_PER_WORKSPACE: ${SUITE_MAX_SHARES_PER_WORKSPACE:-}
      SUITE_MAX_SELECTION_CARDS: ${SUITE_MAX_SELECTION_CARDS:-}
      SUITE_DISK_SOFT_BYTES: ${SUITE_DISK_SOFT_BYTES:-}
      SUITE_DISK_HARD_BYTES: ${SUITE_DISK_HARD_BYTES:-}
      # Per-minute rate limits; empty keeps the default.
      SUITE_CLAIM_RATE_LIMIT: ${SUITE_CLAIM_RATE_LIMIT:-}
      SUITE_ROTATE_RATE_LIMIT: ${SUITE_ROTATE_RATE_LIMIT:-}
      SUITE_SHARE_RESOLVE_RATE_LIMIT: ${SUITE_SHARE_RESOLVE_RATE_LIMIT:-}
      SUITE_SHARE_CREATE_RATE_LIMIT: ${SUITE_SHARE_CREATE_RATE_LIMIT:-}
      SUITE_PUBLISH_RATE_LIMIT: ${SUITE_PUBLISH_RATE_LIMIT:-}
      SUITE_ADMIN_RATE_LIMIT: ${SUITE_ADMIN_RATE_LIMIT:-}
    expose:
      - "1234"
      - "1235"
    volumes:
      - suite-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.HEALTH_PORT||1235)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    # The control plane's database: accounts, organizations, subscriptions and
    # licence records all live here (ADR-0069). One pinned major, because a dump
    # from one major restores into the next only through `pg_upgrade`, which
    # makes the tag a decision rather than a convenience.
    #
    # It is a *local* shape, not the deployed one: a hosted launch points
    # SUITE_CONTROL_PLANE_DATABASE_URL at RDS and starts `docker compose up`
    # without this profile, so the box runs no database of its own. `pnpm up`
    # and `pnpm dev:db` pass `--profile local-db`; nothing else needs to.
    image: postgres:17-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suite}
      POSTGRES_DB: ${POSTGRES_DB:-suite}
    volumes:
      - suite-postgres:/var/lib/postgresql/data
    healthcheck:
      # `$$` is compose's escape: the shell inside the container expands these,
      # so the probe keeps working when the user or database name is changed.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  control-plane:
    # The second process: accounts, billing and the Postgres above. It mounts
    # the route modules in `apps/control-plane/src/modules` and owns no
    # documents, so the relay keeps syncing when this service is down.
    # Same host-build rule as `app`: the default is a local tag, so nothing
    # here reaches for a registry. `docker compose build control-plane` tags
    # this name; `deploy/deploy.sh` builds only the relay.
    image: ${SUITE_CONTROL_PLANE_IMAGE:-suite:local-control-plane}
    build:
      context: .
      target: control-plane
      args:
        SUITE_VERSION: ${SUITE_VERSION:-0.0.0}
    restart: unless-stopped
    # No `depends_on: postgres`: that service is behind the `local-db` profile, and
    # compose refuses to start a service whose dependency is profiled away. The control
    # plane retries its own connection instead — a boot that lands before Postgres is
    # ready clears its memo and answers the next request, which is also what a managed
    # database with a failover does.
    # The same hardening as `app`, and the same reason: this process holds the
    # Stripe signing secret and the auth signing key, so the smaller its
    # writable surface, the better. It owns no file of its own -- Postgres is a
    # network service -- so a read-only root fits it exactly.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.5"
    environment:
      NODE_ENV: production
      PORT: "1236"
      SUITE_LOG_LEVEL: ${SUITE_LOG_LEVEL:-info}
      # The one connection string. Accounts, organizations, subscriptions and
      # licence records share it (ADR-0069 amendment); the billing service reads
      # it as a fallback for `SUITE_BILLING_DATABASE_URL`. If you change
      # POSTGRES_PASSWORD above, change this too -- the literal default is what
      # keeps the file free of nested expansion.
      SUITE_CONTROL_PLANE_DATABASE_URL: ${SUITE_CONTROL_PLANE_DATABASE_URL:-postgres://suite:suite@postgres:5432/suite}
      # Accounts, as `services/auth/src/http/env.ts` reads them.
      SUITE_AUTH_ENABLED: ${SUITE_AUTH_ENABLED:-0}
      SUITE_AUTH_SECRET: ${SUITE_AUTH_SECRET:-}
      SUITE_AUTH_URL: ${SUITE_AUTH_URL:-}
      # Same database as the control plane. Unset here would leave the auth module with
      # no pool at all, which it treats as a boot failure. The default follows
      # `SUITE_CONTROL_PLANE_DATABASE_URL` rather than repeating the compose service name:
      # the auth module prefers this variable, so a literal `postgres` default meant a
      # deployed host with RDS configured answered `getaddrinfo ENOTFOUND postgres` on
      # every sign-in while `/health` reported the database ok.
      SUITE_AUTH_DATABASE_URL: ${SUITE_AUTH_DATABASE_URL:-${SUITE_CONTROL_PLANE_DATABASE_URL:-postgres://suite:suite@postgres:5432/suite}}
      SUITE_GOOGLE_CLIENT_ID: ${SUITE_GOOGLE_CLIENT_ID:-}
      SUITE_GOOGLE_CLIENT_SECRET: ${SUITE_GOOGLE_CLIENT_SECRET:-}
      SUITE_AUTH_RP_ID: ${SUITE_AUTH_RP_ID:-}
      SUITE_AUTH_RP_NAME: ${SUITE_AUTH_RP_NAME:-}
      SUITE_AUTH_MAX_ORGS_PER_USER: ${SUITE_AUTH_MAX_ORGS_PER_USER:-}
      SUITE_TURNSTILE_SECRET: ${SUITE_TURNSTILE_SECRET:-}
      SUITE_ADMISSION_REQUIRED: ${SUITE_ADMISSION_REQUIRED:-}
      SUITE_AUTH_REQUIRE_VERIFICATION: ${SUITE_AUTH_REQUIRE_VERIFICATION:-1}
      # Mail. A local stack sets `console`, which writes the message to this
      # container's log; a deployment that leaves the transport out gets the
      # console transport too, which is why a verification link is never
      # delivered until one of these is set.
      SUITE_MAIL_TRANSPORT: ${SUITE_MAIL_TRANSPORT:-console}
      SUITE_MAIL_FROM: ${SUITE_MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUITE_SMTP_URL: ${SUITE_SMTP_URL:-}
      # Who may use the operator surface: the admissions queue and the starter
      # templates. Read here and on the relay, so one list answers both.
      SUITE_ADMIN_EMAILS: ${SUITE_ADMIN_EMAILS:-}
      # Billing, as `services/billing/src/stripe/plugin.ts` reads it. The panel's
      # saved rows beat these; a mode switch reads only its own `_LIVE` set.
      SUITE_BILLING_ENABLED: ${SUITE_BILLING_ENABLED:-0}
      SUITE_BILLING_MODE: ${SUITE_BILLING_MODE:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TIERS: ${STRIPE_PRICE_TIERS:-}
      STRIPE_SECRET_KEY_LIVE: ${STRIPE_SECRET_KEY_LIVE:-}
      STRIPE_WEBHOOK_SECRET_LIVE: ${STRIPE_WEBHOOK_SECRET_LIVE:-}
      STRIPE_PRICE_TIERS_LIVE: ${STRIPE_PRICE_TIERS_LIVE:-}
      SUITE_SETTINGS_KEY: ${SUITE_SETTINGS_KEY:-}
      # Account deletion reaches the relay's own delete route with this pair.
      # Empty leaves documents, shares and attachments in place and reports them
      # as not-configured, which is the self-host answer.
      SUITE_RELAY_URL: ${SUITE_RELAY_URL:-}
      SUITE_RELAY_PURGE_TOKEN: ${SUITE_RELAY_PURGE_TOKEN:-}
    expose:
      - "1236"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||1236)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  docs:
    # Reader-facing docs site. Off by default: `docker compose --profile docs up`.
    # It reads only the built site and needs no volume or database.
    profiles: ["docs"]
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      # The docs image is Caddy on Alpine with no Node in it, so the probe has to be
      # one the image actually has. `wget --spider` exits non-zero on a 4xx/5xx, which
      # is the same "is the tree being served" question the Node one asked.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3001/docs"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    build:
      context: .
      target: web
      # The canvas is compiled into this image, so the values it inlines are arguments
      # here rather than runtime environment. `SUITE_TURNSTILE_SITE_KEY` is the widget's
      # public site key: without it a deployment that sets SUITE_TURNSTILE_SECRET has a
      # sign-up form that cannot produce the token the server demands.
      args:
        SUITE_VERSION: ${SUITE_VERSION:-0.0.0}
        SUITE_TURNSTILE_SITE_KEY: ${SUITE_TURNSTILE_SITE_KEY:-}
        SUITE_AUTH_URL: ${SUITE_AUTH_URL:-}
        SUITE_CRASH_DSN: ${SUITE_CRASH_DSN:-}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Caddy holds one certificate, a TLS session cache and the built canvas.
    # It needs 80/443, so it keeps exactly one capability and nothing else; the
    # root filesystem is read-only and its three state directories are tmpfs
    # unless the `caddy-data` volume below is enabled, which is what makes a
    # certificate survive a recreate.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /config:size=8m
      - /data:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    environment:
      SUITE_DOMAIN: ${SUITE_DOMAIN:-localhost}
      # Who may reach /admin, /metrics and /api/admin. A deployed host sets this to its
      # tailnet (100.64.0.0/10); a local stack adds the Docker bridge, because a browser on
      # this machine arrives through it and is in no tailnet. The default fails closed
      # either way: nothing outside these ranges is served.
      SUITE_OPERATOR_ALLOW: ${SUITE_OPERATOR_ALLOW:-127.0.0.1/32 ::1/128 172.16.0.0/12}
      SUITE_ACME_EMAIL: ${SUITE_ACME_EMAIL:-}
      # The three production hosts and the two static roots they serve. The
      # defaults are `*.localhost` so a bare `docker compose up` uses Caddy's
      # internal CA instead of asking Let's Encrypt for a domain it does not own;
      # `.env.example` sets the real hostnames for a deployment.
      SUITE_APP_HOST: ${SUITE_APP_HOST:-app.localhost}
      SUITE_DOCS_HOST: ${SUITE_DOCS_HOST:-docs.localhost}
      SUITE_MARKETING_HOST: ${SUITE_MARKETING_HOST:-suite.localhost}
      SUITE_DOCS_ROOT: ${SUITE_DOCS_ROOT:-/srv/docs}
      SUITE_MARKETING_ROOT: ${SUITE_MARKETING_ROOT:-/srv/marketing}
      # Where `/api/auth/*`, `/api/billing/*` and `/stripe/*` are proxied.
      SUITE_CONTROL_PLANE_UPSTREAM: ${SUITE_CONTROL_PLANE_UPSTREAM:-control-plane:1236}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Certificates and the ACME account live inside the container. If the
    # service is recreated often, that means a new certificate each time; Let's
    # Encrypt allows five duplicate certificates per week and then refuses, so
    # a host that redeploys by recreate should keep them in a volume. Enable
    # both this mount and the `caddy-data` volume at the bottom together.
    # volumes:
    #   - caddy-data:/data

volumes:
  suite-data:
  # Accounts, organizations, subscriptions and licence records. Separate from
  # `suite-data` on purpose: a document backup and an identity backup are
  # restored on different schedules, and losing one must not mean losing both.
  suite-postgres:
  # Uncomment with the mount above to persist certificates across recreates.
  # caddy-data:
