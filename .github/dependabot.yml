# The only dependency automation in Alpha.
#
# One pull request per ecosystem per week, with the packages grouped so a week
# of patches is one review instead of fifteen. Major bumps stay separate: they
# are a decision, not a patch.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
