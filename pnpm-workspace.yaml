packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "e2e"
allowBuilds:
  esbuild: true
# `services/billing` declares the SES SDK as an optional dependency for the
# Lambda bundle, but the repository install stays AWS-free on purpose: the
# emailer loads it by name only when SES_FROM_ADDRESS is set, and its tests
# assert the missing-SDK path. Install it for a deployment, not here.
ignoredOptionalDependencies:
  - "@aws-sdk/client-ses"
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - turbo@2.11.10
patchedDependencies:
  loro-prosemirror@0.4.4: patches/loro-prosemirror@0.4.4.patch
  loro-websocket@0.6.2: patches/loro-websocket@0.6.2.patch
  # Stryker 10's vitest-runner joins test-suite names with a space, but Vitest 5
  # matches testNamePattern against names joined with " > ", so every covered
  # mutant ran zero tests and was reported Survived. Same change as
  # stryker-mutator/stryker-js#6214; drop this entry when it is released.
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch
