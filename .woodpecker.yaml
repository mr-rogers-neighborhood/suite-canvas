# The gate, in the format a Woodpecker server would run.
#
# One step, and it calls the repository's own `check:full` rather than restating what
# that check does. A pipeline that lists lint, typecheck and tests separately is a second
# definition of healthy, and the two drift the first time either changes.
#
# `check` is the fast gate a push runs, using `--changed` where the repository can; that
# needs git history, which a container may not have, so a runner gets `check:full`.
#
# Run it locally with no server:
#
#   woodpecker-cli exec .woodpecker.yaml
#
# The image carries git because `check` asserts that the committed package output still
# matches a fresh build, which needs a real checkout rather than an export.
when:
  - event: [push, pull_request]

steps:
  - name: gate
    image: node:26-bookworm
    environment:
      CI: "1"
    commands:
      # Corepack is no longer bundled with Node, so the pin is read from the repository
      # and installed directly. That is stricter than corepack anyway: the pipeline uses
      # exactly the pnpm version the repository declares, not whatever corepack resolves.
      - PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
      - npm install -g "pnpm@$PNPM_VERSION"
      - pnpm install --frozen-lockfile
      - pnpm check:full
