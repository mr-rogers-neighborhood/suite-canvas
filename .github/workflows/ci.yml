name: CI

# Present and unrun: every workflow on this account ends in `startup_failure` with zero jobs, so
# nothing here gates `main`. The local gate in docs/how-to/test-and-verify.md is authoritative.
# Re-enabling needs a self-hosted runner or an entitlement change; the job logic below needs no edit.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Mutation testing is too slow for PRs; it runs nightly-ish and on demand.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Read-only by default; nothing in this workflow needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Billing service tests (payment path)
        run: pnpm turbo run test --filter=@suite/billing

      # Documentation drifts silently; these are cheap and mechanical.
      - name: Docs check (links, fences, prose, generated indexes)
        run: pnpm docs:check

      - name: Docs symbols (paths, scripts, ADR references)
        run: pnpm docs:symbols

      - name: Shape check (file length, observe sites, raw Loro writes)
        run: pnpm shape

      - name: Coverage (reported, graph thresholds enforced)
        run: pnpm coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

      # Stories as tests: an a11y or interaction regression in a story fails here,
      # in a real Chromium, before the build.
      - name: Install Playwright browser
        run: pnpm --filter @suite/e2e exec playwright install --with-deps chromium

      - name: Story tests (a11y, browser)
        run: pnpm test:stories

      - name: Build
        run: pnpm build

      - name: Docs site smoke
        run: |
          pnpm --filter @suite/docs start > /tmp/docs.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/docs > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/docs > /dev/null
          curl -fsS http://127.0.0.1:3001/llms.txt > /dev/null
          curl -fsS http://127.0.0.1:3001/docs/tutorials/run-locally.md | grep -q '^#'

      - name: Upload app build
        uses: actions/upload-artifact@v4
        with:
          name: canvas-dist
          path: apps/canvas/dist
          retention-days: 7

  mutation:
    name: Mutation report (graph)
    # Scheduled/manual only: a full graph run costs minutes per mutant batch, and
    # the score is a diagnostic, so it must never gate a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation testing (report only, no score gate)
        run: pnpm mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14

  e2e-smoke:
    name: End-to-end (smoke)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @suite/e2e exec playwright install --with-deps chromium

      - name: Run smoke end-to-end tests
        run: pnpm e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            e2e/playwright-report
            e2e/.artifacts
          retention-days: 7

  e2e:
    name: End-to-end (full)
    # Runs on a push to main, a tag, the schedule, or a manual dispatch, and is unrun like every job
    # here. A pull request would get the smoke tier; the unit and story suites cover the rest.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @suite/e2e exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            e2e/playwright-report
            e2e/.artifacts
          retention-days: 7
